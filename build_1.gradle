plugins {
    id 'org.springframework.boot' version '3.3.13'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.github.ben-manes.versions' version '0.51.0'
    id 'java'
    id 'jacoco'
    id 'pmd'
}

group = 'com.example.identity'
version = '0.0.1-SNAPSHOT'
description = 'OktaIdentityService'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

//configurations {
//    compilOnly{
//        extendsFrom annotationProcessor
//    }
//}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.3")
    set('springCloudAwsVersion', '3.1.1')
}

dependencies {
 //If you don't want to type :3.3.13 on every Spring Boot dependency (and test dependency), add Gradle's native platform() BOM at the top of your dependencies block:
    // BOMs (manages versions for Spring Boot, Spring Cloud, AWS, Lombok, H2, etc.)
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.13')
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}")
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.3.13')
    testAnnotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.3.13')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Cloud & AWS
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    // Okta SDK
    implementation 'com.okta.sdk:okta-sdk-api:16.0.0'
    runtimeOnly 'com.okta.sdk:okta-sdk-impl:16.0.0'
    runtimeOnly 'com.okta.sdk:okta-sdk-httpclient:8.2.5'

    // Database & Migrations
    implementation 'com.amazonaws.secretsmanager:aws-secretsmanager-jdbc:2.0.2'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // OpenAPI & Utilities
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.apache.commons:commons-lang3'

    // Lombok & DevTools
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

//if you use the platform(...) lines above, commentout/remove dependencyManagement below so both mechanisms are not competing to resolve BOM versions.
//dependencyManagement {
//    imports {
//        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
//        mavenBom "io.awsspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
//    }
//}

pmd {
    ignoreFailures = false
    sourceSets = [sourceSets.main]
    ruleSets = [
            "java-basic",
            "java-braces",
            "java-clone",
            "java-codesize",
            "java-design",
            "java-empty",
            "javefinalizer",
            "java-migrating",
            "java-strictexception",
            "java-strings",
            "java-unnecessary",
            "java-unusedcode"
    ]
}


project.ext {
    if(!project.hasProperty("archiveVersion")) {
        archiveVersion = project.parent?.ext?.archiveVersion ?:'LOCAL'
    }
//    buildNumber = System.getevn('BUILD_NUMBER') ?: 'X'
    buildNumber = System.getenv("BUILD_NUMBER") ?:'X'
    archiveVersion = "${projectVersion}.${buildNumber}"
    archiveName = "${projectName}-${archiveVersion}"
    jarFileName= "${archiveName}.jar"
    GIT_BRANCH = System.getenv('GIT_BRANCH') ?: 'develop'
}

springBoot {
    buildInfo()
}

bootJar {
    launchScript()
    archiveFileName = jarFileName
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.0
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
